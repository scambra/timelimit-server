name: Docker Image CI

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Add Codeberg upstream and fetch tags
        run: |
          git remote add upstream https://codeberg.org/timelimit/timelimit-server.git || true
          git fetch upstream --tags --prune

      - name: Find the latest merged Codeberg release tag
        id: release
        run: |
          tag=$(git for-each-ref --format='%(refname:strip=2)' refs/tags \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | while read -r candidate; do
                if git merge-base --is-ancestor "$candidate" HEAD; then
                  echo "$candidate"
                fi
              done \
            | sort -r \
            | head -n 1)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "master_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check out the selected Codeberg release
        run: git checkout --detach "${{ steps.release.outputs.tag }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/scambra/timelimit-server/timelimit:${{ steps.release.outputs.tag }}
            ghcr.io/scambra/timelimit-server/timelimit:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Return to master
        run: git checkout -B master "${{ steps.release.outputs.master_sha }}"

      - name: Update Helm chart release metadata
        id: chart
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          current_app_version=$(sed -nE 's/^appVersion: "?([^"]+)"?/\1/p' charts/timelimit/Chart.yaml)
          if [ "$current_app_version" = "$RELEASE_TAG" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_chart_version=$(sed -nE 's/^version: ([0-9]+)\.([0-9]+)\.([0-9]+)/\1.\2.\3/p' charts/timelimit/Chart.yaml)
          IFS=. read -r major minor patch <<< "$current_chart_version"
          next_chart_version="$major.$minor.$((patch + 1))"

          sed -i -E \
            -e "s/^version: .*/version: $next_chart_version/" \
            -e "s/^appVersion: .*/appVersion: \"$RELEASE_TAG\"/" \
            charts/timelimit/Chart.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/timelimit/Chart.yaml
          git commit -m "chore(chart): release TimeLimit $RELEASE_TAG"
          git push origin master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the updated Helm chart
        if: steps.chart.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run helm-chart-publish.yml --ref master
