name: Sync from Codeberg

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  sync:
    name: Sync Codeberg upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Codeberg upstream and fetch
        run: |
          git remote add upstream https://codeberg.org/timelimit/timelimit-server.git || true
          git fetch upstream --tags --prune

      - name: Determine upstream default branch
        id: upstream
        run: |
          upstream_branch=main
          if git ls-remote --exit-code --heads upstream main >/dev/null 2>&1; then
            upstream_branch=main
          elif git ls-remote --exit-code --heads upstream master >/dev/null 2>&1; then
            upstream_branch=master
          else
            ref=$(git ls-remote --symref upstream HEAD | sed -n 's@^ref: refs/heads/\([^ ]*\).*@\1@p')
            test -n "$ref"
            upstream_branch=$ref
          fi
          echo "branch=$upstream_branch" >> "$GITHUB_OUTPUT"

      - name: Update the daily sync branch
        id: sync
        run: |
          branch=sync/codeberg
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          if git rev-parse --verify "origin/$branch" >/dev/null; then
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch" master
          fi

          before=$(git rev-parse HEAD)
          git merge --no-edit -s recursive -X theirs "upstream/${{ steps.upstream.outputs.branch }}"
          after=$(git rev-parse HEAD)
          echo "changed=$([[ $before != $after ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Push the daily sync branch
        if: steps.sync.outputs.changed == 'true'
        run: git push origin sync/codeberg

      - name: Find latest upstream release tag
        id: release
        run: |
          tag=$(git for-each-ref --format='%(refname:strip=2)' refs/tags \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort -r \
            | head -n 1)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check whether the release is already merged
        id: check
        run: |
          git checkout master
          if git merge-base --is-ancestor "${{ steps.release.outputs.tag }}" HEAD; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the tagged release into master
        if: steps.check.outputs.merged == 'false'
        run: |
          git merge --no-edit -s recursive -X theirs "${{ steps.release.outputs.tag }}" \
            -m "chore(sync): Codeberg release ${{ steps.release.outputs.tag }}"
          git push origin master

      - name: Build the merged release image
        if: steps.check.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-image.yml --ref master
